services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hydrogest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydrogest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hydrogest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hydrogest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: hydrogest-dynamodb
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - hydrogest_dynamodb_data:/home/dynamodblocal/data

volumes:
  hydrogest_pgdata:
    driver: local
  hydrogest_dynamodb_data:
    driver: local
