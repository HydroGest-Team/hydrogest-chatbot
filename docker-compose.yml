services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hydrogest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hydrogest}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hydrogest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hydrogest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hydrogest_pgdata:
    driver: local
