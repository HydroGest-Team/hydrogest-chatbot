spring.application.name=chatbot-service

# Cargar configuracion local opcional (ignorado si no existe)
# Busca en el directorio de trabajo actual, en directorio padre o en classpath
spring.config.import=optional:file:application-local.properties,optional:file:../application-local.properties,optional:file:./chatbot-service/application-local.properties,optional:classpath:application-local.properties

# Puerto del servidor
server.port=8080

# -----------------------------------------------------------------------------
# Propiedades Chatbot con mapeo directo a variables de entorno y valores por defecto
# -----------------------------------------------------------------------------
chatbot.gemini-api-key=${GEMINI_API_KEY:}
chatbot.embedding-model=${EMBEDDING_MODEL:gemini-embedding-001}
chatbot.llm-model=${LLM_MODEL:gemini-3.8-flash}
chatbot.embedding-dim=${EMBEDDING_DIM:1536}
chatbot.db-url=${DB_URL:jdbc:postgresql://localhost:5432/hydrogest}
chatbot.db-user=${DB_USER:postgres}
chatbot.db-password=${DB_PASSWORD:postgres}
chatbot.service-api-key=${SERVICE_API_KEY:}
chatbot.rag-top-k=${RAG_TOP_K:4}
chatbot.umbral-similitud=${UMBRAL_SIMILITUD:0.65}
chatbot.conocimiento-dir=${CONOCIMIENTO_DIR:../conocimiento}
chatbot.evaluacion-path=${EVALUACION_PATH:../evaluacion/preguntas.json}
chatbot.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8000}

# -----------------------------------------------------------------------------
# Spring AI Google GenAI Configuration
# -----------------------------------------------------------------------------
spring.ai.google.genai.api-key=${chatbot.gemini-api-key}
spring.ai.google.genai.chat.options.model=${chatbot.llm-model}
spring.ai.google.genai.embedding.api-key=${chatbot.gemini-api-key}
spring.ai.google.genai.embedding.text.options.model=${chatbot.embedding-model}

# -----------------------------------------------------------------------------
# Datasource (PostgreSQL + JDBC)
# -----------------------------------------------------------------------------
spring.datasource.url=${chatbot.db-url}
spring.datasource.username=${chatbot.db-user}
spring.datasource.password=${chatbot.db-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=-1

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# Flyway (migraciones de base de datos)
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
